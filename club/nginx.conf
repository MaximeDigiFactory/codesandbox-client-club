pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server_tokens off;
  map $http_origin $cors_origin {
    default "";
    "https://librechat.digiconseil.fr" $http_origin;
    "https://librechat-preprod.digiconseil.fr" $http_origin;
  }
  map $host $asset_root {
    default /usr/share/nginx/preview;
    artefacts.digiconseil.fr /usr/share/nginx/runtime;
  }
  server {
    listen 8080;
    server_name artefacts.digiconseil.fr *.artefacts.digiconseil.fr;
    root $asset_root;
    index index.html;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Range" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net https://unpkg.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net https://data.jsdelivr.com https://unpkg.com https://registry.npmjs.org https://esm.sh; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors https://librechat.digiconseil.fr https://librechat-preprod.digiconseil.fr; object-src 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control "public, max-age=300" always;
    if ($request_method = OPTIONS) { return 204; }
    location = /healthz { access_log off; return 200 "ok\n"; }
    location /__csb_vendor/ { alias /usr/share/nginx/vendor/; }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
  }
}
